<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Nova Geração em Cena</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
    <main class="login-wrap">
        <section class="login-card">
            <h2>Área administrativa</h2>
            <p>Faça login para acessar o painel de ingressos.</p>

            <form id="admin-login-form" class="login-form">
                <div class="form-field">
                    <label for="username">Usuário</label>
                    <input id="username" name="username" type="text" placeholder="Digite seu usuário" required>
                </div>

                <div class="form-field">
                    <label for="password">Senha</label>
                    <input id="password" name="password" type="password" placeholder="Digite sua senha" required>
                </div>

                <div id="login-message" class="login-message" aria-live="polite"></div>

                <button type="submit" class="btn-principal">Entrar no painel</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
